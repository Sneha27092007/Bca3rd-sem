<!DOCTYPE html>
<html>
    <head>
        <title>External CSS eith JavaScript</title>
        <!--External CSS-->
        <link rel="stylesheet" type="text/css" href="style.css"/>

    </head>
    <body>
        <h1>External Style Sheet Demonstration</h1>
        <p id="messege">Click the button to change this text.</p>
        <button onclick="changeText()">Click Here</button>

    </body>
    <script>
        function changeText(){
            document.getElementById("messege").innerHTML="Welcome to JavaScript!";
        }
    </script>
</html>
